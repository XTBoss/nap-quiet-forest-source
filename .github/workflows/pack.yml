name: 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    name: 构建并打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 打包
        run: npm run pack

      - name: 上传压缩包
        uses: actions/upload-artifact@v5
        with:
          name: quiet-forest
          path: 安静小森林.zip
          if-no-files-found: error

      - name: 发布版本 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "安静小森林.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: 更新 latest 预发布
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="由 GitHub Actions 根据 main 最新提交自动打包。

          提交：${GITHUB_SHA}

          解压后不要直接在压缩包里打开文件。Mac 双击「启动.command」，Windows 双击「启动.bat」。"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "安静小森林.zip" --clobber
            gh release edit latest --notes "${notes}"
          else
            gh release create latest "安静小森林.zip" \
              --title "最新打包" \
              --notes "${notes}" \
              --prerelease
          fi
